<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Panel de Administración</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="handleLogout()">Cerrar Sesión</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-card *ngIf="currentSession() as session">
    <ion-card-header>
      <ion-card-title>Panel de Control - Administrador</ion-card-title>
      <ion-card-subtitle>Usuario: {{ session.username }}</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <p>Rol actual: <strong>{{ session.role }}</strong></p>
      <p>Sesión activa: {{ session.isAuthenticated ? 'Sí' : 'No' }}</p>
    </ion-card-content>
  </ion-card>
</ion-content>
